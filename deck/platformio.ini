; OpenBricx Deck — ESP-IDF firmware (ESP32-S3 SuperMini)
;
; Build:   pio run
; Flash:   pio run -t upload          (or flash the merged bin from the Console)
; Monitor: pio device monitor -b 115200
;
; A merged single-image .bin (for the Console's Firmware Flasher) is produced at
; .pio/build/esp32s3/firmware.bin only after `pio run -t mergebin` — see README.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L

; Firmware version lives in src/config.h (single source of truth — bump it there).
; TinyUSB CDC/HID + VID/PID are configured via sdkconfig.defaults, not -D flags.
;
; After each build, scripts/package_bins.py writes two clearly named images to
; deck/dist/:
;   openbricx-deck-ota-v<ver>.bin       → upload over Wi-Fi OTA (app image only)
;   openbricx-deck-v<ver>-firmware.bin  → USB cold-flash at offset 0x0 (merged)
extra_scripts = post:scripts/package_bins.py
